[package]
name = "lagom"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lagom for macOS, Linux and Windows."
publish = false

[dependencies]
anyhow = "1"
gpui = "0.2.2"
lagom-core = { path = "../../crates/lagom-core" }

# Liquid Glass sidebar. All four crates are already in the lockfile through gpui.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSAppearance", "NSResponder", "NSView", "NSGraphics", "NSGlassEffectView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
raw-window-handle = "0.6"
