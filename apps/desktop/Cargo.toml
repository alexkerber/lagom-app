[package]
name = "lagom"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "lagom for macOS, Linux and Windows."
publish = false

[dependencies]
anyhow = "1"
gpui = "0.2.2"
lagom-core = { path = "../../crates/lagom-core" }
# Grapheme clusters for the caret and backspace (emoji, combining marks). Already in Cargo.lock.
unicode-segmentation = "1.13"
# The mail worker's runtime and channels; the core's IMAP and SMTP need Tokio. Already in Cargo.lock.
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
# Local time zone for list dates and Later times; std has none. Already in Cargo.lock via async-imap.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "unstable-locales"] }
# System locale for task dates; already in Cargo.lock via GPUI.
sys-locale = "0.3"
# Already used by chrono; Google needs the system IANA zone, not only its UTC offset.
iana-time-zone = "0.1"
# The app password between the add-account form and the keychain. Already in Cargo.lock.
zeroize = "1"
# Window layout preferences; already in Cargo.lock.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Live Markdown styling in Compose, with the parser the send path uses. Already in Cargo.lock.
pulldown-cmark = { version = "0.13", default-features = false }

# HTML mail in the reading pane: WKWebView on macOS, WebView2 on Windows. Linux shows the text
# part (see html_view.rs), so no WebKitGTK.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = { version = "0.57", default-features = false }

[dev-dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
# GPUI's TestAppContext, to drive key dispatch in tests.
gpui = { version = "0.2.2", features = ["test-support"] }

[build-dependencies]
# shortcut: Cargo gates build dependencies by host, use target gating when it supports cross-compiling to Windows.
embed-resource = "3.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSView", "NSWindow", "NSGraphics", "NSGlassEffectView", "NSVisualEffectView", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSBundle"] }

block2 = "0.6.2"
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger"] }

[target.'cfg(target_os = "linux")'.dependencies]
# D-Bus notifications and activation callbacks without a platform event loop.
notify-rust = "4.18.2"

[package.metadata.bundle]
name = "lagom"
identifier = "app.lagommail.desktop"
icon = ["../../brand/app-icon/export/AppIcon.icns", "../../brand/app-icon/export/lagom-512.png", "../../brand/app-icon/export/lagom.ico"]
