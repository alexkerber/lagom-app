name: Lagom
options:
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    # shortcut: arm64 simulator only; add x86_64 when Intel Mac development is needed.
    ARCHS: arm64
    TARGETED_DEVICE_FAMILY: '1,2'
    PRODUCT_BUNDLE_IDENTIFIER: com.alexkerber.lagom
    DEVELOPMENT_TEAM: 3KFU9JQ5LH
    CODE_SIGN_STYLE: Automatic
    # Development defaults. release.sh passes the tag's version and the UTC minute to xcodebuild.
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    OTHER_LDFLAGS: ['$(inherited)', '-lsqlite3', '-liconv', '-lresolv', '-lc++']
targets:
  Lagom:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - PrivacyInfo.xcprivacy
      - path: Generated/LagomCore.swift
    dependencies:
      - framework: Generated/LagomFFI.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    entitlements:
      path: Generated/Lagom.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionCompleteUnlessOpen
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: lagom
        # XcodeGen writes 1.0 and 1 here otherwise, and the build settings never reach the app.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The only encryption is TLS to the user's own mail and OAuth servers (rustls) and the system
        # Keychain. No own data encryption. See docs/release.md, "Export compliance", before changing.
        ITSAppUsesNonExemptEncryption: false
        BGTaskSchedulerPermittedIdentifiers: [app.lagommail.refresh]
        UIBackgroundModes: [fetch]
        # mailto links; the system sends them here only with the com.apple.developer.mail-client entitlement.
        CFBundleURLTypes:
          - CFBundleURLName: mailto
            CFBundleURLSchemes: [mailto]
        # The share sheet of an attachment preview and a long press on a mail image offer "Save to Photos".
        NSPhotoLibraryAddUsageDescription: lagom saves an image or video to Photos only when you choose to save it.
        # Theme.background in light and dark, so the first frame does not flash.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LagomTests:
    type: bundle.unit-test
    platform: iOS
    # Run fixtures without launching the mail app or opening its store.
    sources:
      - Tests
      - Sources/MailModel.swift
      - Sources/Theme.swift
      - Sources/Presentation.swift
      - Sources/PlannerModel.swift
      - Sources/Demo.swift
      - Generated/LagomCore.swift
    dependencies:
      - framework: Generated/LagomFFI.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexkerber.lagom.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lagom:
    build:
      targets:
        Lagom: all
        LagomTests: [test]
    test:
      targets: [LagomTests]
