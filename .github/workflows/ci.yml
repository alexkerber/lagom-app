name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # GPUI's Linux backends and the core's Secret Service keyring.
      # https://github.com/zed-industries/zed/blob/main/script/linux
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libssl-dev libasound2-dev \
            libglib2.0-dev libdbus-1-dev libzstd-dev libclang-dev cmake pkg-config
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Test HTML sizing script
        run: node --test apps/desktop/src/main_window/html/fit.test.cjs

  apple-mobile:
    name: iOS static library and app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Apple bindings
        run: scripts/build-apple.sh
      - name: Generate Xcode project
        run: xcodegen generate --spec apps/mobile/apple/project.yml
      - name: Build iPhone and iPad app without a simulator device
        run: xcodebuild build -project apps/mobile/apple/Lagom.xcodeproj -scheme Lagom -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Compile view model tests without running the app
        run: xcodebuild build-for-testing -project apps/mobile/apple/Lagom.xcodeproj -scheme Lagom -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Check the generated Swift async boundary without an app
        run: |
          cargo build --locked -p lagom-ffi
          xcrun swiftc apps/mobile/apple/Generated/LagomCore.swift \
            crates/lagom-ffi/tests/swift-smoke.swift \
            -I apps/mobile/apple/Generated/LagomFFI.xcframework/ios-arm64/Headers \
            -L target/debug -llagom_ffi -framework Security -framework SystemConfiguration \
            -lresolv -liconv -o target/mobile-swift-smoke
          target/mobile-swift-smoke
          xcrun swiftc apps/mobile/apple/Generated/LagomCore.swift \
            apps/mobile/apple/Sources/MailModel.swift apps/mobile/apple/Sources/Demo.swift crates/lagom-ffi/tests/mobile-model.swift \
            -I apps/mobile/apple/Generated/LagomFFI.xcframework/ios-arm64/Headers \
            -L target/debug -llagom_ffi -framework Security -framework SystemConfiguration \
            -lresolv -liconv -o target/mobile-model-tests
          target/mobile-model-tests
          target/mobile-model-tests --wake

  android:
    name: Android native libraries and app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The default also installs the retired 'tools' package, which sdkmanager no longer finds.
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Test Android build orchestration
        run: python3 scripts/test-build-android.py
      - name: Build Android libraries and Kotlin bindings
        run: scripts/build-android.sh
      - name: Assemble Android app
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug
      - name: Run fixture-only JVM tests
        working-directory: apps/mobile/android
        run: ./gradlew testDebugUnitTest
