name: Performance

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'crates/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docs/performance-budgets.toml'
      - 'scripts/perf.py'
      - 'scripts/test-perf.py'
      - '.github/workflows/perf.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  budgets:
    name: Budgets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Same packages as ci.yml: GPUI's Linux backends and the core's Secret Service keyring.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libssl-dev libasound2-dev \
            libglib2.0-dev libdbus-1-dev libzstd-dev libclang-dev cmake pkg-config
      - name: Test the budget runner
        run: python3 scripts/test-perf.py
      - name: Measure budgets (release)
        run: python3 scripts/perf.py
      # shortcut: temporary size diagnostic for PR #131, remove before merge.
      - name: Binary size by crate (Linux, temporary)
        if: always() && runner.os == 'Linux'
        continue-on-error: true
        run: |
          size -A target/release/lagom
          cargo install cargo-bloat --locked --version 0.12.1
          cargo bloat --release --locked -p lagom --bin lagom --crates -n 30
