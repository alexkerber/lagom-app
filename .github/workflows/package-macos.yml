name: Package macOS

# Tags v1.2.3 build the release dmg and attach it to the draft GitHub release.
# Pull requests that touch packaging build an ad-hoc signed dmg as a workflow artifact.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - scripts/package-macos.sh
      - scripts/build-release.sh
      - scripts/sparkle.sh
      - scripts/sparkle-item.sh
      - apps/desktop/macos/sparkle-ed-public-key
      - .github/workflows/package-macos.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Universal dmg
    runs-on: macos-latest
    outputs:
      dmg: ${{ steps.package.outputs.dmg }}
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Version from the tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ $REF_TYPE == tag ]]; then version=${REF_NAME#v}; else version=0.0.0-dev.${SHA:0:7}; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: OAuth client IDs
        env:
          OAUTH_ENV: ${{ secrets.LAGOM_OAUTH_ENV }}
        run: |
          if [[ -n $OAUTH_ENV ]]; then
            umask 077
            printf '%s\n' "$OAUTH_ENV" > .env.oauth
          else
            echo '::warning::No LAGOM_OAUTH_ENV secret: Google and Microsoft sign-in are off in this dmg.'
          fi
      - name: Sparkle public key
        run: |
          [[ -s apps/desktop/macos/sparkle-ed-public-key ]] \
            || echo '::warning::No apps/desktop/macos/sparkle-ed-public-key: this dmg has no automatic updates. Run scripts/sparkle-keys.sh.'
      # Pull requests never get the signing keys, even from branches in this repository.
      - name: Signing keychain and notary key
        id: signing
        if: github.event_name != 'pull_request'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [[ -z $P12 || -z $NOTARY_KEY ]]; then
            echo '::warning::No signing secrets: the dmg is signed ad hoc and not notarized.'
            exit 0
          fi
          keychain=$RUNNER_TEMP/lagom-signing.keychain-db
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          {
            echo "LAGOM_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "LAGOM_NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "LAGOM_NOTARY_ISSUER=$NOTARY_ISSUER"
          } >> "$GITHUB_ENV"
          echo "signed=1" >> "$GITHUB_OUTPUT"
      - name: Build, sign and notarize
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          [[ $SIGNED == 1 ]] || export LAGOM_SIGN_IDENTITY=-
          dmg=$(scripts/package-macos.sh "$VERSION" | tail -1)
          echo "dmg=$(basename "$dmg")" >> "$GITHUB_OUTPUT"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"
          lipo -archs target/macos/lagom.app/Contents/MacOS/lagom
          codesign -dv target/macos/lagom.app 2>&1 | grep -E 'Identifier|Authority|Signature|Runtime'
          [[ ! -d target/macos/lagom.app/Contents/Frameworks/Sparkle.framework ]] \
            || codesign -dv target/macos/lagom.app/Contents/Frameworks/Sparkle.framework 2>&1 | grep -E 'Authority|Runtime'
      - name: Remove signing material
        if: always()
        run: |
          [[ ! -f $RUNNER_TEMP/lagom-signing.keychain-db ]] || security delete-keychain "$RUNNER_TEMP/lagom-signing.keychain-db"
          rm -f "$RUNNER_TEMP/notary.p8" .env.oauth
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dmg
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

  # Its own job on a fresh runner: the EdDSA private key never shares a machine with cargo, the
  # build scripts of dependencies or a checkout they could have changed. Tags only.
  sparkle:
    name: Sign the update for Sparkle
    needs: package
    if: github.ref_type == 'tag' && needs.package.outputs.signed == '1'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-dmg
          path: target/macos
      - name: Appcast item
        env:
          VERSION: ${{ needs.package.outputs.version }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [[ ! -s apps/desktop/macos/sparkle-ed-public-key ]]; then
            exit 0
          elif [[ -z $SPARKLE_ED_PRIVATE_KEY ]]; then
            echo '::warning::No SPARKLE_ED_PRIVATE_KEY secret: this release gets no appcast item, so Sparkle will not offer it.'
            exit 0
          fi
          scripts/sparkle-item.sh "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-appcast
          path: target/macos/lagom-*.appcast.xml
          if-no-files-found: ignore

  release:
    name: Attach to the GitHub release
    needs: [package, sparkle]
    # The dmg still ships when the Sparkle job is skipped (ad-hoc build) or has no key.
    if: always() && github.ref_type == 'tag' && needs.package.result == 'success' && needs.sparkle.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-*
          merge-multiple: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/upload-release.sh
          sparse-checkout-cone-mode: false
          path: repo
      # release-draft.yml creates the draft; a human publishes it after docs/release.md.
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DMG: ${{ needs.package.outputs.dmg }}
        # The appcast item goes with the dmg; Pages builds the feed from it once the release is published.
        run: |
          files=("$DMG")
          [[ ! -f ${DMG%.dmg}.appcast.xml ]] || files+=("${DMG%.dmg}.appcast.xml")
          repo/scripts/upload-release.sh "$TAG" "${files[@]}"
