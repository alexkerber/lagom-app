name: Package macOS

# Tags v1.2.3 build the release dmg and attach it to the draft GitHub release.
# Pull requests that touch packaging build an ad-hoc signed dmg as a workflow artifact.
# No job that runs cargo, build scripts or code from an artifact gets a release credential:
# build (cargo, no secrets) -> sign (Developer ID, notary key) -> sparkle (EdDSA key) -> release.
# docs/release.md, "macOS", has the job layout and the threat model.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - scripts/package-macos.sh
      - scripts/sign-macos.sh
      - scripts/build-release.sh
      - scripts/sparkle.sh
      - scripts/sparkle-item.sh
      - apps/desktop/macos/sparkle-ed-public-key
      - .github/workflows/package-macos.yml
  workflow_dispatch:

permissions:
  contents: read

# pipefail: `dmg=$(scripts/sign-macos.sh … | tail -1)` must fail when the script fails.
defaults:
  run:
    shell: bash

jobs:
  # The version, and whether this run signs. It reads no secret value, only whether they exist.
  meta:
    name: Version and signing
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      signed: ${{ steps.meta.outputs.signed }}
    steps:
      - id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          SECRETS: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.APPLE_NOTARY_KEY != '' && secrets.APPLE_NOTARY_KEY_ID != '' && secrets.APPLE_NOTARY_ISSUER_ID != '' }}
        run: |
          if [[ $REF_TYPE == tag ]]; then version=${REF_NAME#v}; else version=0.0.0-dev.${SHA:0:7}; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Only tags and runs on main sign. Pull requests and other branches never do, so a branch
          # cannot get a notarized dmg with its own Sparkle key file.
          if [[ $REF_TYPE != tag && $REF != refs/heads/main ]]; then
            echo "signed=0" >> "$GITHUB_OUTPUT"
          elif [[ $SECRETS == true ]]; then
            echo "signed=1" >> "$GITHUB_OUTPUT"
          else
            echo '::warning::No signing secrets: the dmg is signed ad hoc, not notarized, and a tag attaches nothing.'
            echo "signed=0" >> "$GITHUB_OUTPUT"
          fi

  # Runs cargo and the build scripts of all dependencies, so it gets no signing secret. It makes
  # the unsigned app for the sign job, and an ad-hoc signed dmg for tests.
  build:
    name: Universal app
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Client IDs that ship inside the app: a build input, not a signing credential.
      - name: OAuth client IDs
        env:
          OAUTH_ENV: ${{ secrets.LAGOM_OAUTH_ENV }}
        run: |
          if [[ -n $OAUTH_ENV ]]; then
            umask 077
            printf '%s\n' "$OAUTH_ENV" > .env.oauth
          else
            echo '::warning::No LAGOM_OAUTH_ENV secret: Google and Microsoft sign-in are off in this dmg.'
          fi
      - name: Sparkle public key
        run: |
          [[ -s apps/desktop/macos/sparkle-ed-public-key ]] \
            || echo '::warning::No apps/desktop/macos/sparkle-ed-public-key: this dmg has no automatic updates. Run scripts/sparkle-keys.sh.'
      - name: Build the unsigned app
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          LAGOM_BUILD_ONLY=1 scripts/package-macos.sh "$VERSION"
          rm -f .env.oauth
          lipo -archs target/macos/lagom.app/Contents/MacOS/lagom
          # tar keeps the symlinks and file modes of Sparkle.framework; the artifact zip drops them.
          tar -C target/macos -cf "$RUNNER_TEMP/lagom-app.tar" lagom.app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-app
          path: ${{ runner.temp }}/lagom-app.tar
          if-no-files-found: error
      # For pull requests and tests. Releases ship only the sign job's dmg.
      - name: Ad-hoc signed dmg
        id: adhoc
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          dmg=$(LAGOM_SIGN_IDENTITY=- scripts/sign-macos.sh "$VERSION" | tail -1)
          echo "path=$dmg" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dmg-adhoc
          path: ${{ steps.adhoc.outputs.path }}
          if-no-files-found: error

  # A fresh runner with the Developer ID and the notary key. It runs no cargo and nothing from the
  # artifact: only codesign, hdiutil, notarytool and scripts/sign-macos.sh from this commit.
  sign:
    name: Sign and notarize
    needs: [meta, build]
    if: needs.meta.outputs.signed == '1'
    runs-on: macos-latest
    # The keychain stays unlocked while the job runs; a hung notarization must not keep it for hours.
    timeout-minutes: 60
    outputs:
      dmg: ${{ steps.sign.outputs.dmg }}
      sha256: ${{ steps.sign.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/sign-macos.sh
            apps/desktop/macos/sparkle-ed-public-key
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-app
          path: ${{ runner.temp }}/app
      # Before any credential is on this runner. bsdtar refuses absolute paths, ".." and writing
      # through symlinks unless it gets -P. Then only plain files, folders and symlinks that stay
      # inside the app may remain (Sparkle.framework has its own Versions/Current links).
      - name: Unpack the app
        run: |
          if tar -tf "$RUNNER_TEMP/app/lagom-app.tar" | grep -qv '^lagom\.app/'; then
            echo 'The app artifact holds files outside lagom.app.' >&2
            exit 1
          fi
          mkdir -p target/macos
          tar -xf "$RUNNER_TEMP/app/lagom-app.tar" -C target/macos
          app=$(cd target/macos/lagom.app && pwd -P)
          if [[ -n $(find "$app" ! -type f ! -type d ! -type l) || -n $(find "$app" -type f -links +1) ]]; then
            echo 'The app artifact holds special files or hard links.' >&2
            exit 1
          fi
          find "$app" -type l -print0 | while IFS= read -r -d '' link; do
            target=$(realpath "$link")
            if [[ $target != "$app"/* ]]; then
              echo "The app artifact has a symlink out of the app: ${link#"$app"/}" >&2
              exit 1
            fi
          done
      - name: Signing keychain and notary key
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          keychain=$RUNNER_TEMP/lagom-signing.keychain-db
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          (umask 077; printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8")
          {
            echo "LAGOM_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "LAGOM_NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "LAGOM_NOTARY_ISSUER=$NOTARY_ISSUER"
          } >> "$GITHUB_ENV"
      - name: Sign, notarize and staple
        id: sign
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          dmg=$(scripts/sign-macos.sh "$VERSION" | tail -1)
          codesign -dv target/macos/lagom.app 2>&1 | grep -E 'Identifier|Authority|Signature|Runtime'
          [[ ! -d target/macos/lagom.app/Contents/Frameworks/Sparkle.framework ]] \
            || codesign -dv target/macos/lagom.app/Contents/Frameworks/Sparkle.framework 2>&1 | grep -E 'Authority|Runtime'
          {
            echo "dmg=$(basename "$dmg")"
            echo "path=$dmg"
            echo "sha256=$(shasum -a 256 "$dmg" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - name: Remove signing material
        if: always()
        run: |
          [[ ! -f $RUNNER_TEMP/lagom-signing.keychain-db ]] || security delete-keychain "$RUNNER_TEMP/lagom-signing.keychain-db"
          rm -f "$RUNNER_TEMP/notary.p8"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dmg
          path: ${{ steps.sign.outputs.path }}
          if-no-files-found: error

  # Its own job on a fresh runner: the EdDSA private key never shares a machine with cargo, the
  # build scripts of dependencies or a checkout they could have changed. Tags only.
  sparkle:
    name: Sign the update for Sparkle
    needs: [meta, sign]
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    outputs:
      item: ${{ steps.item.outputs.item }}
      sha256: ${{ steps.item.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/sparkle-item.sh
            scripts/sparkle.sh
            apps/desktop/macos/sparkle-ed-public-key
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-dmg
          path: target/macos
      # The hash comes from the sign job, so only the dmg it made gets the EdDSA signature.
      - name: Check the dmg
        env:
          DMG: ${{ needs.sign.outputs.dmg }}
          SHA256: ${{ needs.sign.outputs.sha256 }}
        run: echo "$SHA256  target/macos/$DMG" | shasum -a 256 -c -
      - name: Appcast item
        id: item
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [[ ! -s apps/desktop/macos/sparkle-ed-public-key ]]; then
            exit 0
          elif [[ -z $SPARKLE_ED_PRIVATE_KEY ]]; then
            echo '::warning::No SPARKLE_ED_PRIVATE_KEY secret: this release gets no appcast item, so Sparkle will not offer it.'
            exit 0
          fi
          item=$(scripts/sparkle-item.sh "$VERSION")
          echo "item=1" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$item" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.item.outputs.item == '1'
        with:
          name: macos-appcast
          path: target/macos/lagom-*.appcast.xml
          if-no-files-found: error

  # Only a signed run ships. Without the signing secrets a tag attaches nothing: the ad-hoc dmg
  # comes from the build job, so it stays a workflow artifact for tests.
  release:
    name: Attach to the GitHub release
    needs: [meta, sign, sparkle]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/upload-release.sh
          sparse-checkout-cone-mode: false
          path: repo
      # Named artifacts from the sign and sparkle jobs into an empty folder outside the checkout.
      # The hashes come from the jobs that made the files.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-dmg
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.sparkle.outputs.item == '1'
        with:
          name: macos-appcast
          path: ${{ runner.temp }}/release
      # release-draft.yml creates the draft; a human publishes it after docs/release.md.
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.meta.outputs.version }}
          DMG_SHA256: ${{ needs.sign.outputs.sha256 }}
          ITEM: ${{ needs.sparkle.outputs.item }}
          ITEM_SHA256: ${{ needs.sparkle.outputs.sha256 }}
        # The appcast item goes with the dmg; Pages builds the feed from it once the release is published.
        run: |
          upload=$GITHUB_WORKSPACE/repo/scripts/upload-release.sh
          cd "$RUNNER_TEMP/release"
          echo "$DMG_SHA256  lagom-$VERSION.dmg" | sha256sum -c -
          files=("lagom-$VERSION.dmg")
          if [[ $ITEM == 1 ]]; then
            echo "$ITEM_SHA256  lagom-$VERSION.appcast.xml" | sha256sum -c -
            files+=("lagom-$VERSION.appcast.xml")
          fi
          "$upload" "$TAG" "${files[@]}"
