# Creates the draft release the moment a v* tag is pushed. The platform builds take minutes, so
# they find this draft and only upload; their own create step stays as a fallback.
name: Release draft

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          prerelease=()
          [[ $TAG != *-* ]] || prerelease=(--prerelease)
          gh release create "$TAG" --draft "${prerelease[@]}" --verify-tag --title "lagom ${TAG#v}" --generate-notes
