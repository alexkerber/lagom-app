name: Windows installer

# Builds target\windows\lagom-<version>-x64-setup.exe. On a v* tag it also attaches it to that
# tag's GitHub release. Optional secrets: LAGOM_GOOGLE_CLIENT_ID, LAGOM_GOOGLE_CLIENT_SECRET and
# LAGOM_MICROSOFT_CLIENT_ID (sign-in), WINDOWS_CERTIFICATE (base64 .pfx) and
# WINDOWS_CERTIFICATE_PASSWORD (code signing). Missing secrets give an unsigned build without sign-in.
on:
  pull_request:
    paths:
      - apps/desktop/**
      - crates/lagom-core/**
      - brand/app-icon/**
      - vendor/**
      - Cargo.toml
      - Cargo.lock
      - scripts/package-windows.*
      - .github/workflows/package-windows.yml
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ((cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages | Where-Object name -eq 'lagom').version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match apps/desktop/Cargo.toml version $version" }
      - name: Build installer
        shell: pwsh
        env:
          LAGOM_GOOGLE_CLIENT_ID: ${{ secrets.LAGOM_GOOGLE_CLIENT_ID }}
          LAGOM_GOOGLE_CLIENT_SECRET: ${{ secrets.LAGOM_GOOGLE_CLIENT_SECRET }}
          LAGOM_MICROSOFT_CLIENT_ID: ${{ secrets.LAGOM_MICROSOFT_CLIENT_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: scripts/package-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lagom-windows-x64
          path: target/windows/lagom-*-setup.exe
          if-no-files-found: error
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Another platform's job may create the release first.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" target/windows/lagom-*-setup.exe --clobber
