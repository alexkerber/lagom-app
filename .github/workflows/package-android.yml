name: Package Android

# Tags v1.2.3 build the signed release App Bundle and APK and attach them to the draft GitHub release.
# Pull requests that touch Android packaging only build, unsigned.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - apps/mobile/android/**/*.gradle.kts
      - apps/mobile/android/gradle.properties
      - apps/mobile/android/gradle/**
      - apps/mobile/android/app/proguard-rules.pro
      - apps/mobile/android/app/src/main/AndroidManifest.xml
      - scripts/build-android.sh
      - .github/workflows/package-android.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Release AAB and APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.build.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Version from the tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ $REF_TYPE == tag ]]; then
            version=${REF_NAME#v}
            # Only tags set LAGOM_VERSION; other builds keep the development versionCode 1.
            echo "LAGOM_VERSION=$version" >> "$GITHUB_ENV"
          else
            version=0.0.0-dev.${SHA:0:7}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build Android libraries and Kotlin bindings
        run: scripts/build-android.sh
      - name: Build release AAB and APK
        id: build
        working-directory: apps/mobile/android
        env:
          # Pull requests never get the upload key, even from branches in this repository.
          LAGOM_ANDROID_KEYSTORE: ${{ github.event_name != 'pull_request' && secrets.LAGOM_ANDROID_KEYSTORE || '' }}
          LAGOM_ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.LAGOM_ANDROID_KEYSTORE_PASSWORD || '' }}
          LAGOM_ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.LAGOM_ANDROID_KEY_ALIAS || '' }}
          LAGOM_ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.LAGOM_ANDROID_KEY_PASSWORD || '' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease
          mkdir -p "$RUNNER_TEMP/out"
          if [[ -n $LAGOM_ANDROID_KEYSTORE ]]; then
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/lagom-$VERSION-android.apk"
            echo "signed=1" >> "$GITHUB_OUTPUT"
          else
            echo '::warning::No upload key: the AAB and APK are unsigned. Play and phones refuse them.'
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/out/lagom-$VERSION-android-unsigned.apk"
          fi
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/lagom-$VERSION-android.aab"
          rm -f app/build/signing/upload.jks
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  release:
    name: Attach to the GitHub release
    needs: package
    # An unsigned build on a tag stays a workflow artifact; it must not reach the release page.
    if: github.ref_type == 'tag' && needs.package.outputs.signed == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/upload-release.sh
          sparse-checkout-cone-mode: false
          path: repo
      # release-draft.yml creates the draft; a human publishes it after docs/release.md.
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: repo/scripts/upload-release.sh "$TAG" "lagom-$VERSION-android.apk" "lagom-$VERSION-android.aab"
