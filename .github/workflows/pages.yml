name: Website

# The site and the Sparkle feed (appcast.xml) for the dmg. Every deploy rebuilds the feed, so a
# site change never drops it. Publishing a release redeploys from main: the github-pages
# environment only deploys main, and a release event runs on the tag.
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/appcast.sh", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'release' }}
  cancel-in-progress: true

jobs:
  redeploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy main with the new release in the feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main

  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Sparkle feed from the published releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          scripts/appcast.sh > site/appcast.xml
          python3 -c 'import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])' site/appcast.xml
          grep -c '<item>' site/appcast.xml || true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
