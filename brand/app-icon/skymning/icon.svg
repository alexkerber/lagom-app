<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A74C6"/><stop offset=".55" stop-color="#5860BC"/><stop offset="1" stop-color="#935FCB"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".5" cy="0" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF0FF" stop-opacity=".62"/><stop offset="1" stop-color="#E6DCFF" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="520" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF1E4" stop-opacity=".98"/>
      <stop offset=".35" stop-color="#FFC7A4" stop-opacity=".7"/>
      <stop offset=".7" stop-color="#F49A8E" stop-opacity=".22"/>
      <stop offset="1" stop-color="#F49A8E" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="env"><rect x="224" y="343" width="576" height="378" rx="48"/></clipPath>
  </defs>
  <!-- layer 1: background -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <!-- envelope shadow -->
  <rect x="236" y="372" width="552" height="370" rx="48" fill="#2B1F6E" opacity=".35" filter="url(#soft)"/>
  <!-- warm light bleeding out around the envelope -->
  <circle cx="512" cy="530" r="210" fill="#FFB89A" opacity=".28" filter="url(#bloom)"/>
  <!-- layer 2: envelope body and lower flaps (frosted glass) -->
  <rect x="224" y="343" width="576" height="378" rx="48" fill="url(#glass)" stroke="#fff" stroke-opacity=".38" stroke-width="3"/>
  <g clip-path="url(#env)">
    <rect x="224" y="343" width="576" height="378" fill="url(#glow)"/>
    <path d="M254.0 736.0 L770.0 736.0 Q810 736 778.0 712.0 L544.0 536.0 Q512 512 480.0 536.0 L246.0 712.0 Q214 736 254.0 736.0 Z" fill="#F3EEFF" fill-opacity=".34" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
  </g>
  <!-- layer 3: top flap (frosted glass, lit from inside) -->
  <path d="M296.0 300.0 L728.0 300.0 Q774 300 741.7 332.8 L544.3 533.2 Q512 566 479.7 533.2 L282.3 332.8 Q250 300 296.0 300.0 Z" fill="#2B1F6E" opacity=".18" filter="url(#soft)" transform="translate(0 10)"/>
  <path d="M296.0 300.0 L728.0 300.0 Q774 300 741.7 332.8 L544.3 533.2 Q512 566 479.7 533.2 L282.3 332.8 Q250 300 296.0 300.0 Z" fill="url(#glass)"/>
  <path d="M296.0 300.0 L728.0 300.0 Q774 300 741.7 332.8 L544.3 533.2 Q512 566 479.7 533.2 L282.3 332.8 Q250 300 296.0 300.0 Z" fill="url(#glow)" opacity=".95"/>
  <path d="M296.0 300.0 L728.0 300.0 Q774 300 741.7 332.8 L544.3 533.2 Q512 566 479.7 533.2 L282.3 332.8 Q250 300 296.0 300.0 Z" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3"/>
</svg>
