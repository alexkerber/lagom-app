[package]
name = "lagom-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared core for Lagom: accounts, sync, local store and search. No UI."
publish = false

[dependencies]
thiserror = "2"
dirs = "6"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
zeroize = "1"
unicode-normalization = "0.1"

async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
nom = "8"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "macros", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# Disable async-imap wire traces, which include LOGIN credentials.
log = { version = "0.4", features = ["max_level_debug"] }
futures-util = { version = "0.3", features = ["sink"] }
mail-parser = { version = "1", features = ["full_encoding"] }

lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "ring", "webpki-roots"] }

# Reuse GPUI's reqwest fork rather than compile a second HTTP stack.
reqwest = { package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
url = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

quick-xml = { version = "0.41", features = ["serialize"] }

# keyring's iOS backend stores with the default accessibility class; this sets ThisDeviceOnly. Same 3.7.0 as keyring's macOS backend.
[target.'cfg(target_os = "ios")'.dependencies]
security-framework = { version = "3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# Already in Cargo.lock; sets the quarantine attribute on saved attachments.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
rusqlite = { version = "0.41", features = ["hooks"] }

# Not on iOS: hickory 0.26 reads Apple DNS settings through SCDynamicStore, which the iOS SDK marks unavailable.
[target.'cfg(not(target_os = "ios"))'.dependencies]
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
