[package]
name = "lagom-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lagom-core = { path = "../lagom-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
zeroize = "1"
tokio = { version = "1", features = ["macros", "rt", "process", "sync"] }

[dev-dependencies]
tempfile = "3"
