[package]
name = "lagom-ffi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bindgen.rs"
required-features = ["bindgen"]

[dependencies]
lagom-core = { path = "../lagom-core" }
uniffi = { version = "=0.32.2", features = ["tokio"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
zeroize = "1"
chrono = "0.4"
keyring = "3.6"

[dev-dependencies]
rusqlite = "0.41"
tempfile = "3"
